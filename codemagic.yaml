workflows:
  mobile-dual-build:
    name: Flutter Android & iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase-2026
      vars:
        FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
    working_directory: mobile
    scripts:
      - name: Inject secrets
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null || {
            echo "ERROR: android/app/google-services.json is not valid JSON after decoding GOOGLE_SERVICES_JSON.";
            echo "Check that the GOOGLE_SERVICES_JSON env var in Codemagic is set and contains a clean base64 string (no surrounding quotes).";
            exit 1;
          }
          printf "ANALYZER_API_URL=%s\nMATCHER_API_URL=%s\nSTATE_API_URL=%s\nVOICE_ASSISTANT_API_URL=%s\n" \
            "$ANALYZER_API_URL" "$MATCHER_API_URL" "$STATE_API_URL" "$VOICE_ASSISTANT_API_URL" > .env
      - name: Flutter pub get
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release --dart-define=VOICE_DIRECT_CONNECT_ENABLED=true
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Patch Xcode signing
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            ios/Runner.xcodeproj/project.pbxproj
      - name: Build iOS app (no codesign)
        script: flutter build ios --release --no-codesign --dart-define=VOICE_DIRECT_CONNECT_ENABLED=true
      - name: Package IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r ShopLens.ipa Payload
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/iphoneos/ShopLens.ipa

  mobile-ios-only-build:
    name: Flutter iOS Build (IPA only)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase-2026
      vars:
        FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
    working_directory: mobile
    scripts:
      - name: Inject secrets
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist
          printf "ANALYZER_API_URL=%s\nMATCHER_API_URL=%s\nSTATE_API_URL=%s\nVOICE_ASSISTANT_API_URL=%s\n" \
            "$ANALYZER_API_URL" "$MATCHER_API_URL" "$STATE_API_URL" "$VOICE_ASSISTANT_API_URL" > .env
      - name: Flutter pub get
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Patch Xcode signing
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            ios/Runner.xcodeproj/project.pbxproj
      - name: Build iOS app (no codesign)
        script: flutter build ios --release --no-codesign --dart-define=VOICE_DIRECT_CONNECT_ENABLED=true
      - name: Package IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r ShopLens.ipa Payload
    artifacts:
      - build/ios/iphoneos/ShopLens.ipa
