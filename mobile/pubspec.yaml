name: shoplens
description: ShopLens Flutter app — connects to existing GCP backend

publish_to: 'none'

version: 1.31.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase — same project as web app
  firebase_core:        ^3.3.0
  firebase_auth:        ^5.1.0
  cloud_firestore:      ^5.1.0
  firebase_messaging:   ^15.0.0

  # HTTP — calls same Cloud Run endpoints as web app's fetch()
  dio:                  ^5.4.3

  # State management
  flutter_riverpod:     ^2.5.1
  riverpod_annotation:  ^2.3.5

  # Routing
  go_router:            ^14.1.4

  # Image
  image_picker:         ^1.1.2
  cached_network_image: ^3.3.1

  # Live scan — real-time camera + on-device object detection
  camera:                          ^0.11.0+2
  google_mlkit_object_detection:   ^0.15.0

  # URL launcher — opens purchase links in external browser
  url_launcher:         ^6.3.0

  # Video — HLS from existing Cloud Storage
  video_player:         ^2.8.6
  video_thumbnail:      ^0.5.3

  # Environment config
  flutter_dotenv:       ^5.1.0

  # App/build version info — reads the real per-platform version
  # (APK versionName, iOS Info.plist, web version.json), all of
  # which Flutter derives from the `version:` field above.
  package_info_plus:    ^8.0.0

  # Data models
  freezed_annotation:   ^2.4.4
  json_annotation:      ^4.9.0

  # Voice assistant — mic capture + WebSocket relay to services/voice-assistant
  record:               ^7.1.0
  web_socket_channel:   ^3.0.1
  permission_handler:   ^11.3.0
  # flutter_pcm_sound has zero web support; flutter_sound's stream-playback
  # path (alpha-quality on web, stable on Android/iOS/macOS) covers all the
  # platforms this app targets with one package.
  flutter_sound:        ^9.27.0
  # Used directly (not just transitively via record_web/flutter_sound_web) to
  # probe the browser's real AudioContext sample rate — see
  # core/utils/web_audio_sample_rate_web.dart.
  web:                  ^1.1.0

dev_dependencies:
  build_runner:           ^2.4.11
  freezed:                ^2.5.4
  json_serializable:      ^6.8.0
  riverpod_generator:     ^2.4.3
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints:          ^4.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/shoplens-logo-nobckg.png
    - assets/shoplens-logo.jpeg

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/shoplens-logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/shoplens-logo-nobckg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: assets/shoplens-logo-nobckg.png
  android_12:
    color: "#0F172A"
    image: assets/shoplens-logo-nobckg.png
